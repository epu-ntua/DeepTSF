# to run this you need to create a .env file with the contents of .env_keycloak and fill the missing variables.
services:

  backend:
    container_name: DeepTSF-backend
    hostname: DeepTSF-backend
    # image: inergy2020iccs/deeptsf_backend:1.0.2  # only for releases
    build:
      context: ./
      target: backend
      dockerfile:  Dockerfile_keycloak
    restart: always
    ports:
      - '${BACKEND_PORT:-8081}:${BACKEND_PORT:-8081}'
    expose:
      - '${BACKEND_PORT:-8081}'
    stdin_open:
      true
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # Same command as the Dockerfile ENTRYPOINT, but also mirrors all output
    # to ./logs/backend.log on the host so logs are readable without docker access.
    entrypoint: ["/bin/bash", "-c", "mkdir -p /app/logs && conda run --no-capture-output -n DeepTSF_env uvicorn api:app --host 0.0.0.0 --port $${BACKEND_PORT:-8081} 2>&1 | tee -a /app/logs/backend.log"]
    depends_on:
      - redis
    # Uses all .env parameters
    # deploy: # activate this if you want gpu usage
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]
    mem_limit: 1G
    networks:
       - appnet
  
  worker:
    build:
      context: ./
      target: celery-worker
      dockerfile:  Dockerfile_keycloak
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    mem_limit: 6g
    networks:
       - appnet

  redis:
    image: redis:7-alpine
    restart: always
    networks:
       - appnet

  dagster:
    container_name: DeepTSF--dagster-orchestrator
    hostname: DeepTSF--dagster-orchestrator
    restart: always
    # image: inergy2020iccs/deeptsf_dagster:1.0.1 # only for releases
    build:
      context: ./
      target: dagster
      dockerfile:  Dockerfile_keycloak
    depends_on:
      - redis
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    expose:
      - 8006
    ports:
      - 8006:8006
    env_file:
      - .env
      # Uses following .env parameters:
      # MLFLOW_TRACKING_URI
      # MLFLOW_S3_ENDPOINT_URL
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
    mem_limit: 4g
    networks:
       - appnet

  # frontend:
