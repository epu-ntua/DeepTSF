[pytest]
testpaths = .
python_files = test_*.py
addopts = -p no:cacheprovider -ra
# a whole pipeline run of the slowest case takes well under this
timeout = 900
markers =
    pipeline: runs the full DeepTSF Dagster job for a case (slow)
    inference: loads a model produced by a pipeline case and serves it through the API
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
