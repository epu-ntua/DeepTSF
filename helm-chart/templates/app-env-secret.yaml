{{- /*
Extra environment variables for backend, dagster and worker, read from a .env
file passed at deploy time (helm --set-file envFile=<path>). Values set
explicitly under `env:` in the deployments take precedence over these.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-deeptsf-env
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
{{- range $line := splitList "\n" (default "" .Values.envFile) }}
{{- $line = trim $line }}
{{- if and $line (not (hasPrefix "#" $line)) (contains "=" $line) }}
{{- $kv := regexSplit "=" (trimPrefix "export " $line) 2 }}
  {{ trim (index $kv 0) }}: {{ index $kv 1 | trim | trimAll "\"" | trimAll "'" | quote }}
{{- end }}
{{- end }}
