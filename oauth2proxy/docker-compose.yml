# Dagster auth layer, running on the gpu machine next to dagster.
# Chain: nginx proxy manager (https://${DAGSTER_PUBLIC_HOST})
#        -> oauth2_proxy_dagster (:4180) -> dagster_gateway (:8090)
#        -> ${DAGSTER_HOSTNAME} (:8006, from ../deeptsf_backend/docker-compose-dagster-celery.yml)
# The gateway also writes per-run user tokens into ${REDIS_HOST} (db 0), where
# dagster/worker auth_runtime.py reads them.
#
# Deployment-specific values come from ./.env:
#   DAGSTER_PUBLIC_HOST  public host name of the dagster UI, e.g. deeptsf-dagster.example.org
#   COOKIE_DOMAIN        domain the auth cookie is valid for, e.g. .example.org
#   DAGSTER_HOSTNAME     must match DAGSTER_HOSTNAME in ../deeptsf_backend/.env
#   REDIS_HOST           must match REDIS_HOST in ../deeptsf_backend/.env
#   KC_ISSUER_URL        keycloak realm URL, https://<keycloak>/realms/<realm>
#
# Run with (from this directory; reads ./.env):
#   docker-compose -p <project>-oauth2proxy up -d

# keycloak_net is the network nginx proxy manager, dagster and its redis broker
# are all on, so NPM can forward to "oauth2_proxy_dagster" by name.
networks:
  keycloak_net:
    external: true

volumes:
  # Created once with: docker volume create eg_offline_tokens
  eg_offline_tokens:
    external: true

services:
  oauth2_proxy_dagster:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.11.0
    container_name: oauth2_proxy_dagster
    networks:
      - keycloak_net
    restart: unless-stopped
    # Also published on the host for debugging (curl http://localhost:4180/ping);
    # NPM itself reaches it over keycloak_net by container name.
    ports:
      - "4180:4180"
    command:

      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${KC_ISSUER_URL}
      - --client-id=${KC_CLIENT_ID}
      - --client-secret=${KC_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_COOKIE_SECRET}
      - --redirect-url=https://${DAGSTER_PUBLIC_HOST:?set in .env}/oauth2/callback
      - --upstream=http://dagster_gateway:8090/
      - --reverse-proxy=true
      - --email-domain=*
      - --cookie-secure=true
      - --cookie-samesite=none #change this
      - --whitelist-domain=${COOKIE_DOMAIN:?set in .env}
      - --session-store-type=redis
      - --redis-connection-url=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-celery-redis}:6379/2
      - --cookie-domain=${COOKIE_DOMAIN}
      # Without this (default 0) oauth2-proxy never re-checks a stored session with
      # keycloak, so logging out of another app in the realm leaves dagster logged in
      # until the 7-day cookie expires. With it, a session older than 1m is refreshed;
      # once the SSO session is gone the refresh fails and the session is dropped when
      # the access token expires. Keep it below keycloak's access token lifespan.
      # Does not affect the dagster offline tokens (separate client, see enrollment.py).
      - --cookie-refresh=1m
      # - --session-cookie-minimal=true
      # optional, if you want identity headers forwarded upstream:
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --show-debug-on-error=true
      - --skip-jwt-bearer-tokens=true
      - --cookie-name=_oauth2_proxy_dagster
      - --backend-logout-url=${KC_ISSUER_URL}/protocol/openid-connect/logout?id_token_hint={id_token}&post_logout_redirect_uri=https%3A%2F%2F${DAGSTER_PUBLIC_HOST}%2F
      - --oidc-extra-audience=jupyterhub
      - --oidc-extra-audience=account
      # The dagster UI polls /graphql continuously. Without per-request CSRF cookies,
      # every unauthenticated poll overwrites the single shared CSRF cookie, so the
      # cookie no longer matches when the user returns to /oauth2/callback
      # -> "CSRF token mismatch, potential attack". These give each login flow its own.
      - --cookie-csrf-per-request=true
      - --cookie-csrf-per-request-limit=10

      - --pass-access-token=true
      - --pass-authorization-header=true
      - --pass-user-headers=true
      # XHR/GraphQL calls must get 401 instead of a 302 to keycloak: a redirect is
      # useless to fetch() and it churns cookies. The dagster UI re-authenticates via
      # a normal page load instead.
      - --api-route=^/graphql
      # $$ is compose's escape for a literal $ (regex end-of-string anchor)
      - --skip-auth-route=^/favicon\.ico$$
      - --skip-auth-route=^/robots\.txt$$
      - --skip-auth-route=^/_next/.*
      - --skip-auth-route=^/static/.*


  dagster_gateway:
    image: python:3.12-slim
    container_name: dagster_gateway
    restart: unless-stopped
    networks:
      - keycloak_net
    environment:
      # Without this, the gateway's print() debug output is block-buffered and
      # never reaches `docker logs` (uvicorn's own INFO lines go to stderr and
      # show up regardless, which makes it look like the gateway is silent).
      PYTHONUNBUFFERED: "1"
      DAGSTER_UPSTREAM: "http://${DAGSTER_HOSTNAME:-dagster-orchestrator}:8006"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST:-celery-redis}:6379/0"
      # run -> user mapping must outlive the longest training run
      RUN_TOKEN_TTL_SECONDS: "2592000"
      OAUTH2_PROXY_INTERNAL_URL: "http://oauth2_proxy_dagster:4180"
      # Offline-token enrollment (see enrollment.py). PUBLIC_BASE_URL must match
      # the redirect URI registered on the dagster-offline keycloak client.
      KC_ISSUER_URL: "${KC_ISSUER_URL}"
      KC_OFFLINE_ID: "${KC_OFFLINE_ID}"
      KC_OFFLINE_SECRET: "${KC_OFFLINE_SECRET}"
      PUBLIC_BASE_URL: "https://${DAGSTER_PUBLIC_HOST}"
      EG_TOKEN_ENC_KEY: "${EG_TOKEN_ENC_KEY}"
      EG_OFFLINE_TOKEN_DIR: "/srv/eg-auth"
      # Re-issue a user's offline token on page load once it is this close to expiring.
      EG_OFFLINE_RENEW_BEFORE_DAYS: "5"
      # Must match keycloak's "Offline Session Idle" for the dagster-offline client
      # (realm default 30). Used to estimate expiry when the token has no exp claim.
      EG_OFFLINE_SESSION_IDLE_DAYS: "30"
    volumes:
      - ./dagster_gateway.py:/app/dagster_gateway.py:ro
      - ./enrollment.py:/app/enrollment.py:ro
      - ./offline_store.py:/app/offline_store.py:ro
      # Per-user keycloak offline tokens, encrypted at rest. Shared with the
      # dagster worker, which reads them to refresh access tokens during runs.
      - eg_offline_tokens:/srv/eg-auth
    working_dir: /app
    command: >
      /bin/sh -lc "
        pip install --no-cache-dir fastapi uvicorn[standard] httpx redis websockets cryptography &&
        uvicorn dagster_gateway:app --host 0.0.0.0 --port 8090
      "
